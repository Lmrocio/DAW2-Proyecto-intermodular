<!-- ESTRUCTURA PRINCIPAL DE LA APLICACIÓN -->
<!-- ============================================================================ -->
<!-- Layout semántico: Header > Main (con Breadcrumb) > Footer -->

<!-- Enlace de salto para accesibilidad (WCAG 2.4.1) -->
<a href="#main-content" class="skip-to-main">Saltar al contenido principal</a>

<!-- Encabezado de la aplicación -->
<app-header></app-header>

<!-- Contenido principal -->
<main id="main-content">
  <!-- Breadcrumb global: primer elemento dentro de main, se genera desde BreadcrumbService -->
  <app-breadcrumb-nav></app-breadcrumb-nav>

  <!-- Contenido según ruta (se reemplaza según la ruta actual) -->
  <router-outlet></router-outlet>
</main>

<!-- Pie de página -->
<app-footer></app-footer>

<!-- Componentes globales - ClienteFase2 -->
<app-toast></app-toast>
<app-spinner></app-spinner>
