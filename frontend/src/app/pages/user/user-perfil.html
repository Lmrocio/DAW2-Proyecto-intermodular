<div class="user-perfil">
  <div class="user-perfil__header">
    <div class="user-perfil__avatar">{{ usuario.avatar }}</div>
    <div class="user-perfil__info">
      <h2 class="user-perfil__name">{{ usuario.nombre }}</h2>
      <p class="user-perfil__email">{{ usuario.email }}</p>
    </div>
  </div>

  <div class="user-perfil__body">
    <div class="user-perfil__field">
      <label class="user-perfil__label">Fecha de registro</label>
      <div class="user-perfil__value">{{ usuario.fechaRegistro }}</div>
    </div>
  </div>
</div>
