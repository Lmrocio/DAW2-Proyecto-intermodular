<div class="user-perfil">
  <div class="user-perfil__header">
    <div class="user-perfil__avatar">👤</div>
    <div class="user-perfil__info">
      <h2 class="user-perfil__name">{{ form.value.username || 'Usuario' }}</h2>
      <p class="user-perfil__email">{{ form.value.email }}</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSave()" class="user-perfil__form">
    <!-- Campo Nombre de usuario -->
    <div class="user-perfil__field">
      <label class="user-perfil__label" for="username">Nombre de usuario</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        class="user-perfil__input"
        [class.user-perfil__input--error]="form.get('username')?.invalid && form.get('username')?.touched"
      />
      <span *ngIf="form.get('username')?.hasError('required') && form.get('username')?.touched" class="user-perfil__error">
        El nombre de usuario es obligatorio
      </span>
    </div>

    <!-- Campo Email -->
    <div class="user-perfil__field">
      <label class="user-perfil__label" for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="user-perfil__input"
        [class.user-perfil__input--error]="form.get('email')?.invalid && form.get('email')?.touched"
      />
      <span *ngIf="form.get('email')?.hasError('required') && form.get('email')?.touched" class="user-perfil__error">
        El email es obligatorio
      </span>
      <span *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched" class="user-perfil__error">
        Formato de email inválido
      </span>
    </div>

    <!-- Campo Bio -->
    <div class="user-perfil__field">
      <label class="user-perfil__label" for="bio">Biografía</label>
      <textarea
        id="bio"
        formControlName="bio"
        class="user-perfil__textarea"
        rows="4"
        placeholder="Cuéntanos algo sobre ti..."
      ></textarea>
    </div>

    <!-- Campo Teléfono -->
    <div class="user-perfil__field">
      <label class="user-perfil__label" for="phone">Teléfono</label>
      <input
        type="tel"
        id="phone"
        formControlName="phone"
        class="user-perfil__input"
        placeholder="+34 600 000 000"
      />
    </div>

    <!-- Indicador de cambios sin guardar -->
    <div *ngIf="form.dirty" class="user-perfil__warning">
      ⚠️ Tienes cambios sin guardar
    </div>

    <!-- Botones de acción -->
    <div class="user-perfil__actions">
      <button type="submit" class="user-perfil__button user-perfil__button--primary" [disabled]="form.invalid">
        💾 Guardar cambios
      </button>
      <button type="button" class="user-perfil__button user-perfil__button--secondary" (click)="onCancel()">
        ❌ Cancelar
      </button>
    </div>
  </form>
</div>
