<div class="register-page">
  <!-- Main: Formulario Central -->
  <main class="register-page__main">
    <div class="register-page__card">
      <!-- Header con icono de usuario -->
      <div class="register-page__header">
        <div class="register-page__icon-wrapper">
          <div class="register-page__icon-blob"></div>
          <span class="material-symbols-outlined register-page__user-icon">person_add</span>
        </div>
        <h1 class="register-page__title">¡Bienvenido!</h1>
        <p class="register-page__subtitle">Crea tu cuenta y comienza a aprender hoy</p>
      </div>

      <!-- Mensaje de error -->
      @if (errorMessage) {
        <div class="register-page__error">
          <span class="material-symbols-outlined">error</span>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <!-- Formulario -->
      <form class="register-page__form" (ngSubmit)="onSubmit()">
        <!-- Nombre de usuario -->
        <div class="register-page__form-group">
          <label class="register-page__label" for="username">Nombre de usuario</label>
          <input
            class="register-page__input"
            id="username"
            type="text"
            placeholder="Elige un nombre de usuario"
            [(ngModel)]="username"
            name="username"
            [disabled]="isLoading"
            required />
        </div>

        <!-- Email -->
        <div class="register-page__form-group">
          <label class="register-page__label" for="email">Correo electrónico</label>
          <input
            class="register-page__input"
            id="email"
            type="email"
            placeholder="nombre@ejemplo.com"
            [(ngModel)]="email"
            name="email"
            [disabled]="isLoading"
            required />
        </div>

        <!-- Contraseña -->
        <div class="register-page__form-group">
          <label class="register-page__label" for="password">Contraseña</label>
          <input
            class="register-page__input"
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Elige una contraseña segura"
            [(ngModel)]="password"
            name="password"
            [disabled]="isLoading"
            required />
          <button type="button" class="register-page__show-password" (click)="togglePasswordVisibility()">
            <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            <span>{{ showPassword ? 'Ocultar' : 'Mostrar contraseña' }}</span>
          </button>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="register-page__form-group">
          <label class="register-page__label" for="confirmPassword">Confirmar contraseña</label>
          <input
            class="register-page__input"
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirma tu contraseña"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [disabled]="isLoading"
            required />
          <button type="button" class="register-page__show-password" (click)="toggleConfirmPasswordVisibility()">
            <span class="material-symbols-outlined">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
            <span>{{ showConfirmPassword ? 'Ocultar' : 'Mostrar contraseña' }}</span>
          </button>
        </div>

        <!-- Terms & Conditions -->
        <div class="register-page__terms">
          <input
            class="register-page__checkbox"
            id="terms"
            type="checkbox"
            [(ngModel)]="acceptTerms"
            name="terms"
            [disabled]="isLoading"
            required />
          <label class="register-page__terms-label" for="terms">
            Acepto los <a href="#" class="register-page__terms-link">términos y condiciones</a>
          </label>
        </div>

        <!-- Botón Registrarse -->
        <button type="submit" class="register-page__submit-btn" [disabled]="isLoading">
          @if (isLoading) {
            <span class="register-page__spinner"></span>
            <span>Registrando...</span>
          } @else {
            <span>Crear cuenta</span>
          }
        </button>
      </form>

      <!-- Login -->
      <div class="register-page__login">
        <p>¿Ya tienes cuenta?</p>
        <a routerLink="/login" class="register-page__login-link">Inicia sesión aquí</a>
      </div>
    </div>
  </main>
</div>
