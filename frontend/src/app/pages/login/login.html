<div class="login-page">
  <!-- Main: Formulario Central -->
  <main class="login-page__main">
    <div class="login-page__card">
      <!-- Header con icono de seguridad -->
      <div class="login-page__header">
        <div class="login-page__icon-wrapper">
          <div class="login-page__icon-blob"></div>
          <span class="material-symbols-outlined login-page__security-icon">security</span>
        </div>
        <h1 class="login-page__title">¡Hola de nuevo!</h1>
        <p class="login-page__subtitle">Entra para seguir aprendiendo a tu ritmo</p>
      </div>

      <!-- Mensaje de error -->
      @if (errorMessage) {
        <div class="login-page__error">
          <span class="material-symbols-outlined">error</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <!-- Formulario -->
      <form class="login-page__form" (ngSubmit)="onSubmit()">
        <!-- Usuario -->
        <div class="login-page__form-group">
          <label class="login-page__label" for="username">Nombre de usuario</label>
          <input
            class="login-page__input"
            id="username"
            type="text"
            placeholder="Tu nombre de usuario"
            [(ngModel)]="username"
            name="username"
            [disabled]="isLoading"
            required />
        </div>

        <!-- Contraseña -->
        <div class="login-page__form-group">
          <label class="login-page__label" for="password">Contraseña</label>
          <div class="login-page__password-wrapper">
            <input
              class="login-page__input"
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Tu contraseña"
              [(ngModel)]="password"
              name="password"
              [disabled]="isLoading"
              required />
          </div>
          <div class="login-page__password-actions">
            <button type="button" class="login-page__show-password" (click)="togglePasswordVisibility()">
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              <span>{{ showPassword ? 'Ocultar' : 'Mostrar' }} contraseña</span>
            </button>
            <a routerLink="/forgot-password" class="login-page__forgot-link">¿La olvidaste?</a>
          </div>
        </div>

        <!-- Botón Entrar -->
        <button type="submit" class="login-page__submit-btn" [disabled]="isLoading">
          @if (isLoading) {
            <span class="login-page__spinner"></span>
            <span>Entrando...</span>
          } @else {
            <span>Entrar ahora</span>
          }
        </button>
      </form>

      <!-- Separador -->
      <div class="login-page__divider">
        <div class="login-page__divider-line"></div>
        <span class="login-page__divider-text">O</span>
        <div class="login-page__divider-line"></div>
      </div>

      <!-- Google OAuth -->
      <button type="button" class="login-page__google-btn" (click)="onGoogleLogin()" [disabled]="isLoading">
        <svg viewBox="0 0 48 48" class="login-page__google-logo">
          <path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" fill="#EA4335"></path>
          <path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" fill="#4285F4"></path>
          <path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" fill="#FBBC05"></path>
          <path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853"></path>
        </svg>
        <span>Entrar con Google</span>
      </button>

      <!-- Registro -->
      <div class="login-page__register">
        <p>¿No tienes cuenta?</p>
        <a routerLink="/register" class="login-page__register-link">Regístrate aquí</a>
      </div>

      <!-- Help text -->
      <p class="login-page__help-text">
        ¿Necesitas ayuda? <a routerLink="/ayuda" class="login-page__help-link">Activa el Asistente arriba a la derecha</a>
      </p>
    </div>
  </main>
</div>
