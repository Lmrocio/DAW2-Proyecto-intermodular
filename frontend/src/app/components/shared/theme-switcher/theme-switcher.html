<!-- ============================================================================ -->
<!-- COMPONENTE: THEME SWITCHER -->
<!-- ============================================================================ -->
<!-- Botón accesible para cambiar entre modo claro y oscuro -->

<button
  type="button"
  class="theme-switcher"
  (click)="toggleTheme()"
  (keydown)="onKeyDown($event)"
  [attr.aria-label]="ariaLabel"
  [title]="buttonTitle"
  role="switch"
  [attr.aria-checked]="isDarkMode"
>
  <span class="theme-switcher__icon">
    <app-header-icon [icon]="isDarkMode ? 'sun' : 'moon'"></app-header-icon>
  </span>
  <span class="theme-switcher__text">{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
</button>
