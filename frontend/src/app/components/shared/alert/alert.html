<div [class]="getAlertClasses()" role="alert" *ngIf="visible">
  <span class="alert__icon" aria-hidden="true">{{ getIcon() }}</span>

  <div class="alert__content">
    <h3 class="alert__message">{{ message }}</h3>

    <p class="alert__description" *ngIf="description">{{ description }}</p>

    <!-- Contenedor para tags dinámicos (Requisito 1.3 - createElement/appendChild) -->
    <div
      #tagContainer
      class="alert__tags"
      *ngIf="tags.length > 0"
      aria-label="Etiquetas de la alerta"
    ></div>
  </div>

  <button
    class="alert__close"
    *ngIf="closeable"
    (click)="onClose()"
    aria-label="Cerrar alerta"
    type="button"
  >
    ✕
  </button>
</div>
