<form class="login-form" [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()">
  <!-- Campo Email -->
  <div class="login-form__field">
    <label for="email" class="login-form__label">Correo electrónico</label>
    <div class="login-form__input-wrapper">
      <lucide-angular [img]="Mail" [size]="18" class="login-form__icon"></lucide-angular>
      <input
        id="email"
        type="email"
        class="login-form__input"
        formControlName="email"
        placeholder="ejemplo@correo.com"
        [class.login-form__input--error]="isFieldInvalid('email')"
      />
    </div>
    <span *ngIf="isFieldInvalid('email')" class="login-form__error">
      {{ getEmailErrorMessage() }}
    </span>
  </div>

  <!-- Campo Contraseña -->
  <div class="login-form__field">
    <label for="password" class="login-form__label">Contraseña</label>
    <div class="login-form__input-wrapper">
      <lucide-angular [img]="Lock" [size]="18" class="login-form__icon"></lucide-angular>
      <input
        id="password"
        [type]="showPassword ? 'text' : 'password'"
        class="login-form__input login-form__input--password"
        formControlName="password"
        placeholder="Tu contraseña secreta"
        [class.login-form__input--error]="isFieldInvalid('password')"
      />
      <button
        type="button"
        class="login-form__toggle"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <lucide-angular
          [img]="showPassword ? EyeOff : Eye"
          [size]="18"
        ></lucide-angular>
      </button>
    </div>
    <span *ngIf="isFieldInvalid('password')" class="login-form__error">
      La contraseña es obligatoria
    </span>
  </div>

  <!-- Opciones: Mostrar contraseña + Olvidaste contraseña -->
  <div class="login-form__options">
    <label class="login-form__checkbox">
      <input
        type="checkbox"
        class="login-form__checkbox-input"
        [(ngModel)]="showPassword"
        [ngModelOptions]="{standalone: true}"
      />
      <span class="login-form__checkbox-custom">
        <lucide-angular
          *ngIf="showPassword"
          [img]="Check"
          [size]="12"
          class="login-form__checkbox-icon"
        ></lucide-angular>
      </span>
      <span class="login-form__checkbox-label">Mostrar contraseña</span>
    </label>

    <a routerLink="/recuperar-contrasena" class="login-form__forgot-link">
      ¿Has olvidado tu contraseña?
    </a>
  </div>

  <!-- Botón Submit -->
  <button
    type="submit"
    class="login-form__submit"
    [disabled]="loginFormGroup.invalid"
  >
    <span>Entrar ahora</span>
    <lucide-angular [img]="ArrowRight" [size]="20"></lucide-angular>
  </button>
</form>
