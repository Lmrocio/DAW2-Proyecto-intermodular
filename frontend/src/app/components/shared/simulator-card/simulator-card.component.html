<div class="card-container">
  <div class="card-content">
    <div class="icon-container">
      <ng-container [ngSwitch]="true">
        <!-- Icono candado para 'shield' o 'seguro' (lock) -->
        <svg *ngSwitchCase="icon === 'shield' || icon === 'seguro' || (title || '').toLowerCase().includes('segur')" width="32" height="32" viewBox="0 0 24 24" fill="none" class="svg-icon-lock">
          <rect x="3" y="11" width="18" height="10" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>

        <!-- Icono repetición (refresh) para 'infinity' o 'infinito' -->
        <svg *ngSwitchCase="icon === 'infinity' || icon === 'infinito' || (title || '').toLowerCase().includes('infinito')"
             width="32" height="32" viewBox="0 0 24 24" fill="none" class="svg-icon-refresh"
             stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <!-- Círculo completo para evitar huecos -->
          <circle cx="12" cy="12" r="8"></circle>
          <!-- Flecha superior derecha para indicar repetición -->
          <polyline points="20 8 20 3 15 3"></polyline>
        </svg>

        <!-- Fallback: vacío -->
        <div *ngSwitchDefault></div>
      </ng-container>
    </div>
    <h3 class="card-title">{{ title }}</h3>
  </div>
</div>
