<!-- Renderizar como ENLACE si tiene 'link' -->
@if (isLink) {
  <a
    [routerLink]="link"
    [class]="buttonClasses()"
    [attr.aria-label]="effectiveAriaLabel()"
    [attr.aria-disabled]="disabled ? 'true' : null"
    [tabindex]="disabled ? -1 : 0"
    (click)="onClick($event)"
  >
    <!-- Icono izquierda -->
    @if (icon && iconPosition === 'left') {
      <lucide-icon
        [name]="icon"
        class="button__icon button__icon--left"
        [attr.aria-hidden]="true"
      />
    }

    <!-- Texto o contenido proyectado -->
    @if (text) {
      <span class="button__text">{{ text }}</span>
    } @else {
      <ng-content />
    }

    <!-- Icono derecha -->
    @if (icon && iconPosition === 'right') {
      <lucide-icon
        [name]="icon"
        class="button__icon button__icon--right"
        [attr.aria-hidden]="true"
      />
    }
  </a>
}

<!-- Renderizar como BOTÓN si no tiene 'link' -->
@if (!isLink) {
  <button
    [class]="buttonClasses()"
    [type]="buttonType"
    [disabled]="disabled"
    [attr.aria-label]="effectiveAriaLabel()"
    (click)="onClick()"
  >
    <!-- Icono izquierda -->
    @if (icon && iconPosition === 'left') {
      <lucide-icon
        [name]="icon"
        class="button__icon button__icon--left"
        [attr.aria-hidden]="true"
      />
    }

    <!-- Texto o contenido proyectado -->
    @if (text) {
      <span class="button__text">{{ text }}</span>
    } @else {
      <ng-content />
    }

    <!-- Icono derecha -->
    @if (icon && iconPosition === 'right') {
      <lucide-icon
        [name]="icon"
        class="button__icon button__icon--right"
        [attr.aria-hidden]="true"
      />
    }
  </button>
}
