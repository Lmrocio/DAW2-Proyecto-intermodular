<!-- Botón como enlace (con routerLink) -->
<a
  *ngIf="routerLink"
  [routerLink]="routerLink"
  [class]="getButtonClasses()"
  role="button"
  tabindex="0"
>
  <ng-content></ng-content>
</a>

<!-- Botón normal -->
<button
  *ngIf="!routerLink"
  [class]="getButtonClasses()"
  [disabled]="disabled"
  [type]="type"
  (click)="onClick()"
>
  <ng-content></ng-content>
</button>
