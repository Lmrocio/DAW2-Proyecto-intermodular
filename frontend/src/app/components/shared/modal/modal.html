<!-- ============================================================================ -->
<!-- COMPONENTE: MODAL -->
<!-- ============================================================================ -->
<!-- Modal accesible con backdrop, cierre con ESC y click fuera -->
<!-- IMPLEMENTA: Accesibilidad completa con ARIA (Requisito 3.2 para 10/10) -->

<!--
  ARIA Attributes Implementados:
  - role="dialog": Define el rol de diálogo modal
  - aria-modal="true": Indica que es un modal que bloquea interacción con el resto de la página
  - aria-labelledby: Referencia al título del modal para accesibilidad
  - aria-hidden="true": Oculta elementos decorativos de lectores de pantalla
  - tabindex="-1": Permite recibir foco programáticamente para focus trap
-->

<div
  *ngIf="isOpen"
  #modalContainer
  [class]="modalClasses"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="title ? 'modal-title' : null"
>
  <!-- Backdrop oscuro -->
  <div
    class="modal__backdrop"
    (click)="onBackdropClick($event)"
    aria-hidden="true"
  ></div>

  <!-- Contenido del modal -->
  <div
    #modalContent
    class="modal__content"
    (click)="onContentClick($event)"
    tabindex="-1"
  >
    <!-- Header del modal -->
    <header class="modal__header" *ngIf="title">
      <h2 id="modal-title" class="modal__title">{{ title }}</h2>
      <button
        type="button"
        class="modal__close-btn"
        (click)="close()"
        aria-label="Cerrar modal"
        title="Cerrar (ESC)"
      >
        <span class="modal__close-icon" aria-hidden="true">×</span>
      </button>
    </header>

    <!-- Botón cerrar sin header -->
    <button
      *ngIf="!title"
      type="button"
      class="modal__close-btn modal__close-btn--floating"
      (click)="close()"
      aria-label="Cerrar modal"
      title="Cerrar (ESC)"
    >
      <span class="modal__close-icon" aria-hidden="true">×</span>
    </button>

    <!-- Cuerpo del modal - Proyección de contenido -->
    <div class="modal__body">
      <ng-content></ng-content>
    </div>

    <!-- Footer del modal - Proyección de contenido opcional -->
    <footer class="modal__footer">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </div>
</div>
