<!-- ============================================================================ -->
<!-- COMPONENTE: MODAL - Modo Guía -->
<!-- ============================================================================ -->
<!-- Modal estilo "tooltip bubble" con guía visual y animación -->
<!-- IMPLEMENTA: Accesibilidad completa con ARIA (Requisito 3.2 para 10/10) -->

<div
  *ngIf="isOpen"
  #modalContainer
  [class]="modalClasses"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title'"
>
  <!-- Overlay oscuro con spotlight -->
  <div
    class="modal__overlay"
    (click)="onBackdropClick($event)"
    aria-hidden="true"
  ></div>

  <!-- Tooltip Bubble - Contenido del modal -->
  <div
    #modalContent
    class="modal__tooltip-bubble"
    (click)="onContentClick($event)"
    tabindex="-1"
  >
    <!-- Barra superior amarilla -->
    <div class="modal__top-bar" aria-hidden="true"></div>

    <!-- Contenido principal -->
    <div class="modal__bubble-content">
      <!-- Columna izquierda: Icono guía -->
      <div class="modal__guide-icon-wrapper">
        <div class="modal__guide-icon">
          <span class="material-symbols-outlined">face_6</span>
        </div>
        <span class="modal__guide-label">Guía</span>
      </div>

      <!-- Columna derecha: Contenido -->
      <div class="modal__text-content">
        <h2 id="modal-title" class="modal__bubble-title">{{ title }}</h2>

        <!-- Cuerpo del modal - Proyección de contenido -->
        <div class="modal__bubble-body">
          <ng-content></ng-content>
        </div>

        <!-- Acciones -->
        <div class="modal__bubble-actions">
          <button
            type="button"
            class="modal__close-link"
            (click)="close()"
            aria-label="Cerrar modal"
          >
            Cerrar
          </button>
          <button
            type="button"
            class="modal__next-btn"
            (click)="onNext()"
            aria-label="Siguiente paso"
          >
            Siguiente
          </button>
        </div>
      </div>
    </div>

    <!-- Punta de flecha (pseudo-elemento en SCSS) -->
  </div>
</div>
