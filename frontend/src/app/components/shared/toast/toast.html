<!-- ============================================================================ -->
<!-- COMPONENTE: TOAST - Auto-cierre automático -->
<!-- ============================================================================ -->

<!-- Toast general para template (compatibilidad) -->
<div
  *ngIf="currentToast"
  class="toast toast--template"
  [class.toast--success]="currentToast.type === 'success'"
  [class.toast--error]="currentToast.type === 'error'"
  [class.toast--info]="currentToast.type === 'info'"
  [class.toast--warning]="currentToast.type === 'warning'"
  [class.toast--closing]="isClosing"
  role="alert"
  aria-live="polite"
>
  <div class="toast__icon-wrapper">
    <div class="toast__blob"></div>
    <span class="material-symbols-outlined toast__line-icon">{{ getIcon() }}</span>
  </div>

  <div class="toast__content">
    <h4 class="toast__title" *ngIf="currentToast?.title">{{ currentToast?.title }}</h4>
    <p class="toast__message">{{ currentToast?.message }}</p>
  </div>

  <button class="toast__close" (click)="close()" aria-label="Cerrar notificación">
    <span class="material-symbols-outlined">close</span>
  </button>
</div>
