<nav class="pagination" aria-label="Paginación">
  <!-- Botón Anterior con texto + flecha -->
  <app-button
    (btnClick)="previousPage()"
    extraClass="pagination-button"
    type="secondary"
    variant="previous"
    size="large"
    icon="left-arrow"
    text="ANTERIOR"
  ></app-button>

  <!-- Números de página -->
  <div class="page-numbers">
    <button
      *ngFor="let page of pages"
      class="page-number"
      [class.active]="page === currentPage"
      (click)="page > 0 && goToPage(page)"
      [attr.aria-label]="page > 0 ? 'Ir a página ' + page : null"
      [attr.aria-current]="page === currentPage ? 'page' : null"
    >
      {{ page > 0 ? page : '...' }}
    </button>
  </div>

  <!-- Botón Siguiente con texto + flecha -->
  <app-button
    (btnClick)="nextPage()"
    extraClass="pagination-button"
    type="secondary"
    variant="previous"
    size="large"
    icon="right-arrow"
    iconPosition="right"
    text="SIGUIENTE"
  ></app-button>
</nav>
