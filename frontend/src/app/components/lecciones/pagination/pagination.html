<nav class="pagination" aria-label="Paginación">
  <!-- Botón Anterior con texto + flecha -->
  <app-button
    (btnClick)="goPrevious()"
    extraClass="pagination-button"
    color="primary"
    variant="brutal"
    size="md"
    icon="arrow-left"
    text="Anterior"
  ></app-button>

  <!-- Números de página -->
  <div class="page-numbers">
    <button
      *ngFor="let page of pages"
      class="page-number"
      [class.active]="page === currentPage"
      (click)="page > 0 && goToPage(page)"
      [attr.aria-label]="page > 0 ? 'Ir a página ' + page : null"
      [attr.aria-current]="page === currentPage ? 'page' : null"
    >
      {{ page > 0 ? page : '...' }}
    </button>
  </div>

  <!-- Botón Siguiente con texto + flecha -->
  <app-button
    (btnClick)="goNext()"
    extraClass="pagination-button"
    color="primary"
    variant="brutal"
    size="md"
    icon="arrow-right"
    iconPosition="right"
    text="Siguiente"
  ></app-button>
</nav>
