<article class="leccion-card">
  <div class="leccion-card__link" role="group">
    <!-- Imagen -->
    <div class="leccion-card__image-wrapper">
      <div class="leccion-card__blob" [class]="'leccion-card__blob--' + nivelColor"></div>
      <img
        *ngIf="leccion.imageVariants"
        [srcset]="(leccion.imageVariants?.small || '') + ' 400w, ' + (leccion.imageVariants?.medium || '') + ' 800w, ' + (leccion.imageVariants?.large || '') + ' 1200w'"
        sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 33vw"
        [src]="leccion.imagen"
        [alt]="leccion.titulo"
        class="leccion-card__image"
        loading="lazy"
      />
      <img
        *ngIf="!leccion.imageVariants"
        [src]="leccion.imagen"
        [alt]="leccion.titulo"
        class="leccion-card__image"
        loading="lazy"
      />
      <div
        class="leccion-card__badge"
        [class]="'leccion-card__badge--' + nivelColor"
      >
        {{ leccion.categoria }}
      </div>
    </div>

    <!-- Contenido: meta (texto) + acciones a la derecha en escritorio -->
    <div class="leccion-card__content">
      <div class="leccion-card__meta">
        <!-- Título -->
        <h3 class="leccion-card__titulo">{{ leccion.titulo }}</h3>

        <!-- Descripción -->
        <p class="leccion-card__descripcion">{{ leccion.descripcion }}</p>
      </div>

      <!-- Botones de acciones en horizontal -->
      <div class="leccion-card__actions">
        <app-button
          [text]="buttonText"
          [link]="[routePrefix, leccion.id]"
          color="accent"
          variant="brutal"
          size="md"
        ></app-button>

        <app-button
          [text]="isSpeaking ? 'Detener' : ''"
          [icon]="isSpeaking ? 'square' : 'play'"
          color="primary"
          variant="brutal"
          size="md"
          [attr.aria-label]="ariaLabelPlay"
          (btnClick)="togglePlay()"
        ></app-button>
      </div>
    </div>
  </div>
</article>
