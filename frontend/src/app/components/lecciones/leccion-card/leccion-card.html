<article class="leccion-card">
  <div class="leccion-card__link" role="group">
    <!-- Imagen -->
    <div class="leccion-card__image-wrapper">
      <div class="leccion-card__blob" [class]="'leccion-card__blob--' + nivelColor"></div>
      <img
        [src]="leccion.imagen"
        [alt]="leccion.titulo"
        class="leccion-card__image"
      />
      <div
        class="leccion-card__badge"
        [class]="'leccion-card__badge--' + nivelColor"
      >
        {{ leccion.categoria }}
      </div>
    </div>

    <!-- Contenido: meta (texto) + acciones a la derecha en escritorio -->
    <div class="leccion-card__content">
      <div class="leccion-card__meta">
        <!-- Título -->
        <h3 class="leccion-card__titulo">{{ leccion.titulo }}</h3>

        <!-- Descripción -->
        <p class="leccion-card__descripcion">{{ leccion.descripcion }}</p>
      </div>

      <!-- Botón(s) de acciones (columna a la derecha) -->
      <div class="leccion-card__actions">
        <app-button
          type="primary"
          variant="blue"
          size="medium"
          [text]="isSpeaking ? 'Detener' : 'Escuchar'"
          [icon]="isSpeaking ? null : 'play'"
          [extraClass]="isSpeaking ? 'leccion-card__play playing' : 'leccion-card__play'"
          (click)="$event.stopPropagation(); $event.preventDefault()"
          (btnClick)="togglePlay()"
        ></app-button>

        <!-- Botón de empezar-->
        <app-button
          type="primary"
          variant="yellow"
          size="medium"
          text="Empezar lección"
          [extraClass]="'leccion-card__btn'"
          (click)="$event.stopPropagation(); $event.preventDefault()"
          (btnClick)="onStartClick()"
        ></app-button>
      </div>
    </div>
  </div>
</article>
