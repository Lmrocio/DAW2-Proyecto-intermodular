<aside class="sidebar-filtros">
  <!-- Header removed as requested -->

  <div class="sidebar-filtros__categories">
    <div *ngFor="let category of categories" class="sidebar-filtros__category">
      <div class="sidebar-filtros__category-header-static">
        <span class="sidebar-filtros__category-title">{{ category.title }}</span>
      </div>
      <div class="sidebar-filtros__options">
        <label *ngFor="let option of category.options" class="sidebar-filtros__option">
          <!-- Input nativo oculto para accesibilidad -->
          <input
            type="checkbox"
            [checked]="isFilterSelected(category.id, option.id)"
            (change)="toggleFilter(category.id, option.id)"
            class="sidebar-filtros__checkbox-native"
            [attr.aria-label]="option.label"
          />

          <!-- Elemento visual del checkbox (estilizable) -->
          <span class="sidebar-filtros__checkbox-custom" aria-hidden="true"></span>

          <span class="sidebar-filtros__option-label">{{ option.label }}</span>
          <span *ngIf="option.count" class="sidebar-filtros__option-count">({{ option.count }})</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Footer con acciones: Filtrar + Restablecer -->
  <div class="sidebar-filtros__footer">
    <div class="sidebar-filtros__footer-actions">
      <app-button
        text="Filtrar"
        color="accent"
        variant="brutal"
        size="sm"
        (btnClick)="applyFilters()"
      ></app-button>

      <app-button
        text="Restablecer"
        color="primary"
        variant="brutal"
        size="sm"
        (btnClick)="resetFilters()"
      ></app-button>
    </div>
  </div>
</aside>
