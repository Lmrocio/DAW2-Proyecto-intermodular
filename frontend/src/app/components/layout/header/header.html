<header class="app-header">
  <div class="app-header__container">

    <!-- Logo -->
    <a href="/" class="app-header__logo" aria-label="Inicio - TecnoMayores">
      <span class="app-header__logo-text">TecnoMayores</span>
    </a>

    <!-- Navegación Principal (Centro - Desktop) -->
    <nav class="app-header__nav app-header__nav--desktop" aria-label="Navegación principal">
      <ul class="app-header__nav-list">
        <li class="app-header__nav-item">
          <a href="/lecciones" class="app-header__nav-link">Lecciones</a>
        </li>
        <li class="app-header__nav-item">
          <a href="/simuladores" class="app-header__nav-link">Simuladores</a>
        </li>
        <li class="app-header__nav-item">
          <a href="/ayuda" class="app-header__nav-link">Ayuda</a>
        </li>
      </ul>
    </nav>

    <!-- Acciones Usuario (Derecha - Desktop) -->
    <div class="app-header__actions app-header__actions--desktop">
      <!-- Botón Guía -->
      <button
        type="button"
        class="app-header__btn-guide"
        (click)="openGuideModal()"
        aria-label="Modo Guía"
        title="Abrir modo guía"
      >
        <span class="app-header__btn-guide-icon">
          <app-header-icon icon="guide"></app-header-icon>
        </span>
        <span class="app-header__btn-guide-text">Modo Guía</span>
      </button>

      <!-- Botón Modo Oscuro/Claro -->
      <app-theme-switcher></app-theme-switcher>

      <!-- Separador -->
      <div class="app-header__separator-vertical"></div>

      <!-- Botón Usuario -->
      <button
        class="app-header__btn-user"
        aria-label="Perfil de usuario"
        title="Mi perfil"
      >
        <app-header-icon icon="profile"></app-header-icon>
      </button>
    </div>

    <!-- Acciones Móvil -->
    <div class="app-header__actions app-header__actions--mobile">
      <!-- Solo icono Modo Guía (móvil) -->
      <button
        type="button"
        class="app-header__btn-guide app-header__btn-guide--mobile-icon"
        (click)="openGuideModal()"
        aria-label="Modo Guía"
        title="Abrir modo guía"
      >
        <app-header-icon icon="guide"></app-header-icon>
      </button>

      <!-- Botón Usuario (móvil) -->
      <button
        class="app-header__btn-user"
        aria-label="Perfil de usuario"
        title="Mi perfil"
      >
        <app-header-icon icon="profile"></app-header-icon>
      </button>

      <!-- Botón Hamburguesa (móvil) -->
      <button
        class="app-header__hamburger"
        [class.app-header__hamburger--active]="menuOpen"
        (click)="toggleMenu()"
        aria-label="Abrir menú de navegación"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-nav"
      >
        <span class="app-header__hamburger-line"></span>
        <span class="app-header__hamburger-line"></span>
        <span class="app-header__hamburger-line"></span>
      </button>
    </div>

  </div>

  <!-- Separador horizontal inferior -->
  <div class="app-header__bottom-separator"></div>

  <!-- Menú Móvil Desplegable -->
  <nav
    class="app-header__mobile-menu"
    [class.app-header__mobile-menu--open]="menuOpen"
    id="mobile-nav"
    aria-label="Menú de navegación móvil"
  >
    <div class="app-header__mobile-menu-content">
      <!-- Navegación -->
      <ul class="app-header__mobile-nav-list">
        <li class="app-header__mobile-nav-item">
          <a href="/lecciones" class="app-header__mobile-nav-link" (click)="closeMenu()">Lecciones</a>
        </li>
        <li class="app-header__mobile-nav-item">
          <a href="/simuladores" class="app-header__mobile-nav-link" (click)="closeMenu()">Simuladores</a>
        </li>
        <li class="app-header__mobile-nav-item">
          <a href="/ayuda" class="app-header__mobile-nav-link" (click)="closeMenu()">Ayuda</a>
        </li>
      </ul>

      <!-- Separador -->
      <div class="app-header__mobile-separator"></div>

      <!-- Botones Modo Guía y Tema (con texto completo) -->
      <div class="app-header__mobile-actions">
        <button
          type="button"
          class="app-header__btn-guide"
          (click)="openGuideModal(); closeMenu()"
          aria-label="Modo Guía"
          title="Abrir modo guía"
        >
          <span class="app-header__btn-guide-icon">
            <app-header-icon icon="guide"></app-header-icon>
          </span>
          <span class="app-header__btn-guide-text">Modo Guía</span>
        </button>

        <app-theme-switcher></app-theme-switcher>
      </div>
    </div>
  </nav>

  <!-- Overlay para móvil -->
  <div
    class="app-header__overlay"
    [class.app-header__overlay--visible]="menuOpen"
    (click)="closeMenu()"
  ></div>

  <!-- Modal de Guía -->
  <app-modal
    [isOpen]="isGuideModalOpen"
    title="¿Sabías que...?"
    (closed)="onGuideModalClosed()"
    (next)="onGuideNext()"
  >
    <p>Aquí encontrarás guías paso a paso con dibujos muy claros. ¡Ideal para aprender sin prisas!</p>
  </app-modal>
</header>
