<section class="lecciones-fotos">
  <div class="lecciones-fotos__container">
    <span class="lecciones-fotos__tag">Clases visuales</span>

    <div class="lecciones-fotos__grid">
      <!-- Columna izquierda - Contenido -->
      <div class="lecciones-fotos__content">
        <h2 class="lecciones-fotos__title">
          Lecciones con fotos reales
        </h2>

        <p class="lecciones-fotos__description">
          Cada lección incluye capturas de pantalla reales de tu dispositivo.
          Así sabrás exactamente dónde tocar y qué hacer en cada paso.
        </p>

        <ul class="lecciones-fotos__benefits">
          <li *ngFor="let benefit of benefits" class="lecciones-fotos__benefit">
            <div class="lecciones-fotos__check-icon">
              <lucide-angular [img]="Check" [size]="16"></lucide-angular>
            </div>
            <span>{{ benefit }}</span>
          </li>
        </ul>

        <a routerLink="/lecciones" class="lecciones-fotos__btn">
          Ver catálogo de lecciones
          <lucide-angular [img]="ArrowRight" [size]="20"></lucide-angular>
        </a>
      </div>

      <!-- Columna derecha - Imagen -->
      <div class="lecciones-fotos__image-wrapper">
        <img
          src="assets/images/imagen-1.svg"
          alt="Persona mayor aprendiendo tecnología"
          class="lecciones-fotos__image"
        />
        <div class="lecciones-fotos__badge">
          <lucide-angular [img]="BookOpen" [size]="20" class="lecciones-fotos__badge-icon"></lucide-angular>
          <span>Explicaciones claras</span>
        </div>
      </div>
    </div>
  </div>
</section>
