<div class="guide-mode-section" *ngIf="isVisible">
  <div class="guide-mode-card">
    <!-- Icono -->
    <div class="guide-icon-container">
      <div class="guide-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Estrella central -->
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <!-- Contenido -->
    <div class="guide-content">
      <h3 class="guide-title">{{ title }}</h3>

      <!-- Row: descripción + acciones a la misma altura -->
      <div class="guide-row">
        <p class="guide-description">{{ description }}</p>

        <div class="guide-actions">
          <app-button
            type="primary"
            variant="blue"
            size="medium"
            [text]="isSpeaking ? 'Detener' : ''"
            [icon]="isSpeaking ? null : 'play'"
            (btnClick)="playAudio()"
            [title]="isSpeaking ? 'Detener reproducción' : ('Escuchar: ' + description)"
            class="guide-listen-btn">
          </app-button>

          <app-button
            type="secondary"
            variant="white"
            size="medium"
            [text]="buttonText"
            (btnClick)="onActivateGuide()"
            class="guide-button-wrapper">
          </app-button>
        </div>
      </div>

    </div>

  </div>
</div>
