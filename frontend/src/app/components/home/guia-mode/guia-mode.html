<div class="guide-mode-section" *ngIf="isVisible">
  <div class="guide-mode-card">
    <!-- Icono -->
    <div class="guide-icon-container">
      <div class="guide-icon">
        <svg class="guide-svg-icon" width="40" height="40" viewBox="0 0 24 24" fill="none">
          <!-- Estrella central -->
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <!-- Contenido -->
    <div class="guide-content">
      <h3 class="guide-title">{{ title }}</h3>

      <!-- Row: descripción + acciones a la misma altura -->
      <div class="guide-row">
        <p class="guide-description">{{ description }}</p>

        <div class="guia-mode__actions">
          <app-button
            text="Saber más"
            color="accent"
            variant="brutal"
            size="md"
            (btnClick)="playAudio()"
          ></app-button>

          <app-button
            text="Modo guía"
            color="primary"
            variant="outline"
            size="md"
            (btnClick)="onActivateGuide()"
          ></app-button>
        </div>
      </div>

    </div>

  </div>
</div>
