<section class="lecciones-section">
  <div class="lecciones-container">
    <!-- Header -->
    <div class="lecciones-header">
      <div class="lecciones-header-content">
        <h2 class="lecciones-title">Lecciones sugeridas</h2>
        <p class="lecciones-subtitle">
          Comienza tu viaje digital por aquí.
        </p>
      </div>
      <a routerLink="/lecciones" class="lecciones-link" aria-label="Ver todo el catálogo de lecciones">
        Ver todo el catálogo
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>

    <!-- Grid de Cards -->
    <div class="lecciones-grid">
      <article *ngFor="let leccion of lecciones" class="leccion-card">
        <div class="leccion-icon-wrapper">
          <div class="leccion-icon-fondo" [ngClass]="'fondo-' + leccion.iconoFondo">
            <img [src]="leccion.imagen" [alt]="leccion.titulo" class="leccion-imagen" />
          </div>
          <!-- Badge Categoría -->
          <span class="leccion-badge" [ngClass]="'badge-' + leccion.categoriaColor">
            {{ leccion.categoria }}
          </span>
        </div>

        <!-- Título -->
        <h3 class="leccion-card-title">
          {{ leccion.titulo }}
        </h3>

        <!-- Descripción + botón de reproducción -->
        <div class="leccion-description-row">
          <p class="leccion-card-description">
            {{ leccion.descripcion }}
          </p>

          <app-button
            color="accent"
            variant="brutal"
            size="sm"
            [text]="speakingId === leccion.id ? 'Detener' : ''"
            [icon]="speakingId === leccion.id ? 'square' : 'play'"
            [iconPosition]="'left'"
            (btnClick)="toggleSpeak(leccion)"
            [ariaLabel]="speakingId === leccion.id ? 'Detener lectura de ' + leccion.titulo : 'Escuchar lección ' + leccion.titulo">
          </app-button>
        </div>

        <!-- Botones en horizontal -->
        <div class="leccion-card-actions">
          <app-button
            [text]="leccion.ctaText || 'Ver lección'"
            [link]="['/lecciones', leccion.id]"
            color="accent"
            variant="brutal"
            size="md"
            [ariaLabel]="'Ver lección: ' + leccion.titulo"
          ></app-button>

          <app-button
            text="Guardar"
            color="primary"
            variant="brutal"
            size="md"
            icon="bookmark"
            (btnClick)="saveLesson()"
            [ariaLabel]="'Guardar lección: ' + leccion.titulo"
          ></app-button>
        </div>
      </article>
    </div>
  </div>
</section>
