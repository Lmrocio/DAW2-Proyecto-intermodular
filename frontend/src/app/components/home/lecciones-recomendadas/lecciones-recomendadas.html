<section class="lecciones-section">
  <div class="lecciones-container">
    <!-- Header -->
    <div class="lecciones-header">
      <div class="lecciones-header-content">
        <h2 class="lecciones-title">Lecciones sugeridas</h2>
        <p class="lecciones-subtitle">
          Comienza tu viaje digital por aquí.
        </p>
      </div>
      <a routerLink="/lecciones" class="lecciones-link">
        Ver todo el catálogo
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>

    <!-- Grid de Cards -->
    <div class="lecciones-grid">
      <article *ngFor="let leccion of lecciones" class="leccion-card">
        <!-- Icono con fondo orgánico -->
        <div class="leccion-icon-wrapper">
          <div class="leccion-icon-fondo" [ngClass]="'fondo-' + leccion.iconoFondo">
            <span class="material-symbols-outlined leccion-icon">{{ leccion.icono }}</span>
          </div>
          <!-- Badge Categoría -->
          <span class="leccion-badge" [ngClass]="'badge-' + leccion.categoriaColor">
            {{ leccion.categoria }}
          </span>
        </div>

        <!-- Título -->
        <h3 class="leccion-card-title">
          {{ leccion.titulo }}
        </h3>

        <!-- Descripción -->
        <p class="leccion-card-description">
          {{ leccion.descripcion }}
        </p>

        <!-- Botón usando app-button -->
        <app-button
          type="secondary"
          variant="white"
          size="medium"
          text="EMPEZAR"
          [fullWidth]="true"
          [routerLink]="['/lecciones', leccion.id]"
          class="leccion-button">
        </app-button>
      </article>
    </div>
  </div>
</section>
