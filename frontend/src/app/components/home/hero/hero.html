<section class="hero">
  <div class="hero__container">
    <!-- Contenido Hero (Columna izquierda) -->
    <div class="hero__content">
      <h1 class="hero__title">{{ title }}</h1>

      <ng-container *ngIf="showInlineListen; else plainDescription">
        <div class="hero__description-actions">
          <p class="hero__description">{{ subtitle }}</p>
          <app-button
            text="{{ isSpeaking ? 'Detener' : 'Escuchar' }}"
            [color]="button1Color"
            variant="brutal"
            size="sm"
            [icon]="isSpeaking ? null : 'play'"
            (btnClick)="playAudio(audioText || subtitle)"
            class="hero__inline-listen">
          </app-button>
        </div>
      </ng-container>

      <ng-template #plainDescription>
        <p class="hero__description">{{ subtitle }}</p>
      </ng-template>

      <!-- Búsqueda (si showSearch es true) -->
      <ng-container *ngIf="showSearch">
        <div class="hero__search">
          <app-search-bar
            [placeholder]="searchPlaceholder"
            (searchChange)="onSearch($event)"
            [showHelpText]="false"
            [showListen]="false"
            [hideTitle]="true"
            [noPadding]="true"
          ></app-search-bar>
        </div>
      </ng-container>

      <!-- Botones de acción -->
      <div class="hero__actions" *ngIf="showButton1 || showButton2">
        <!-- Botón 1 -->
        <ng-container *ngIf="showButton1">
          <app-button
            [text]="button1Text"
            [link]="button1Link"
            [color]="button1Color"
            variant="brutal"
            size="md">
          </app-button>
        </ng-container>

        <!-- Botón 2 -->
        <ng-container *ngIf="showButton2">
          <app-button
            [text]="isSpeaking ? 'Detener' : button2Text"
            [color]="button2Color"
            variant="brutal"
            size="md"
            (btnClick)="playAudio(audioText || subtitle)">
          </app-button>
        </ng-container>
      </div>

      <div class="hero-cta">
        <app-button
          text="Saber más"
          [link]="button1Link"
          [color]="button1Color"
          variant="brutal"
          size="sm"
        ></app-button>

        <app-button
          text="Empezar"
          [link]="['/simuladores']"
          [color]="button2Color"
          variant="brutal"
          size="md"
        ></app-button>
      </div>
    </div>

    <!-- Imagen Hero (Columna derecha) -->
    <div class="hero__image">
      <div class="hero__image-container" [class.hero__image-container--large]="$any(imageLarge)" [class.hero__image-container--no-shadow]="!$any(imageHasShadow)">
        <picture>
          <source
            *ngIf="imageVariants"
            [srcset]="(imageVariants?.small || '') + ' 400w, ' + (imageVariants?.medium || '') + ' 800w, ' + (imageVariants?.large || '') + ' 1200w'"
            type="image/webp"
            sizes="(max-width: 768px) 100vw, 50vw"
          />
          <img [src]="imageUrl" [alt]="imageAlt" loading="lazy" />
        </picture>
       </div>
     </div>
   </div>
 </section>
