<section class="hero">
  <div class="hero__container">
    <!-- Contenido Hero (Columna izquierda) -->
    <div class="hero__content">
      <h1 class="hero__title">Aprende tecnología paso a paso</h1>

      <p class="hero__description">
        Una plataforma diseñada como un cuaderno de notas, con explicaciones claras y dibujos sencillos para disfrutar aprendiendo.
      </p>

      <!-- Botones de acción -->
      <div class="hero__actions">
        <!-- Botón Primario Naranja: Saber sobre nosotros -->
        <app-button
          type="primary"
          variant="orange"
          size="medium"
          text="Saber sobre nosotros"
          routerLink="/about">
        </app-button>

        <!-- Botón Secundario Azul: Escuchar texto -->
        <app-button
          type="primary"
          variant="blue"
          size="medium"
          [text]="isSpeaking ? 'Detener' : 'Escuchar texto'"
          (btnClick)="playAudio()">
        </app-button>
      </div>
    </div>

    <!-- Imagen Hero (Columna derecha) -->
    <div class="hero__image">
      <div class="hero__image-container">
        <img src="assets/images/imagen-6.svg" alt="Ilustración de dispositivo con TecnoMayores" />
      </div>
    </div>
  </div>
</section>
