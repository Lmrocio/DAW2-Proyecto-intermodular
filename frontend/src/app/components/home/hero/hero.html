<section class="hero">
  <div class="hero__container">
    <!-- Contenido Hero (Columna izquierda) -->
    <div class="hero__content">
      <h1 class="hero__title">Aprende tecnología paso a paso</h1>

      <p class="hero__description">
        Una plataforma diseñada como un cuaderno de notas, con explicaciones claras y dibujos sencillos para disfrutar aprendiendo.
      </p>

      <!-- Botones de acción -->
      <div class="hero__actions">
        <!-- Botón Primario: Elevated (con sombra) -->
        <app-button
          variant="primary"
          size="md"
          btnStyle="elevated"
          routerLink="/about"
        >
          Saber más
        </app-button>

        <!-- Botón Secundario: Flat (sin sombra) -->
        <app-button
          variant="secondary"
          size="md"
          btnStyle="flat"
          (click)="playAudio()"
          [attr.aria-pressed]="isSpeaking"
        >
          <lucide-angular [img]="Play" [size]="20"></lucide-angular>
          {{ isSpeaking ? 'Detener' : 'Escuchar página' }}
        </app-button>
      </div>
    </div>

    <!-- Imagen Hero (Columna derecha) -->
    <div class="hero__image">
      <div class="hero__image-container">
        <img src="assets/images/imagen-6.svg" alt="Ilustración de dispositivo con TecnoMayores" />
      </div>
    </div>
  </div>
</section>
