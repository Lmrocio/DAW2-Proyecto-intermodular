# =============================================
# Configuración para TESTS (H2 en memoria)
# =============================================

spring.application.name=Plataforma-Educativa-Adultos-Mayores-TEST

# Puerto diferente para tests
server.port=0

# =============================================
# Base de Datos H2 EN MEMORIA para tests
# =============================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate - H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console para debug
spring.h2.console.enabled=true

# =============================================
# JWT Configuration (valores de test)
# =============================================
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironmentMustBeLongEnough123456789
jwt.expiration=3600000

# =============================================
# Logging reducido para tests
# =============================================
logging.level.root=WARN
logging.level.com.example.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# Deshabilitar features innecesarios en tests
# =============================================
spring.sql.init.mode=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Swagger deshabilitado en tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
